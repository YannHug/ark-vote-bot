on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  vote:
    runs-on: ubuntu-latest
    
    steps:
      - name: Attente aléatoire (0 à 20 minutes)
        # S'applique uniquement si le workflow est déclenché par le cron schedule
        if: github.event_name == 'schedule'
        run: |
          DELAY=$(( RANDOM % 1201 ))
          echo "Déclenchement automatique détecté."
          echo "Attente de $DELAY secondes avant de lancer le bot..."
          sleep $DELAY

      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon0 libxkbcommon-x11-0
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps
      
      - name: Run bot with virtual display
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
          PLAYER_NAME: ${{ secrets.PLAYER_NAME }}
        run: xvfb-run -a python main.py
